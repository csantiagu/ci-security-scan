name: Upload SARIF

# Reusable workflow: sends the SARIF files from scan.yml to GitHub code scanning, so findings show
# in the repo's Security tab and as pull request annotations.
#
# Kept separate from scan.yml because it needs `security-events: write`. A reusable workflow cannot
# ask for more than its caller grants, so callers that only want the scan never have to grant it.
# Code scanning is free on public repos; private repos need GitHub Code Security.

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: The artifact-prefix given to scan.yml.
        type: string
        default: security-scan

permissions: {}

jobs:
  upload:
    name: Upload to code scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repo so code scanning can map results to files
      security-events: write # upload the SARIF results to code scanning
      actions: read # read the SARIF artifacts uploaded by scan.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-sarif-*
          path: ${{ runner.temp }}/sarif
          merge-multiple: true

      - name: Find SARIF files
        id: files
        run: |
          for tool in osv gitleaks semgrep trivy-image trivy-config; do
            if [ -f "$RUNNER_TEMP/sarif/$tool.sarif" ]; then present=true; else present=false; fi
            echo "$tool=$present" >> "$GITHUB_OUTPUT"
          done

      # One upload per tool, each with its own category, so a later scan replaces only its own results.
      - if: steps.files.outputs.osv == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/sarif/osv.sarif
          category: security-scan/osv-scanner

      - if: steps.files.outputs.gitleaks == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/sarif/gitleaks.sarif
          category: security-scan/gitleaks

      - if: steps.files.outputs.semgrep == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/sarif/semgrep.sarif
          category: security-scan/semgrep

      - if: steps.files.outputs.trivy-image == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/sarif/trivy-image.sarif
          category: security-scan/trivy-image

      - if: steps.files.outputs.trivy-config == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/sarif/trivy-config.sarif
          category: security-scan/trivy-config
